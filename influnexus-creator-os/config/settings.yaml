# Core settings. Paths are relative to the project root unless absolute.
timezone: Asia/Kolkata
daily_brief_time: "09:30"
language: english        # creator instruction (21 Nov 2026): English scripts; Hinglish allowed only on request
languages_allowed: [english, hinglish]
models_dir: ${CREATOROS_MODELS:-~/models}

script:
  target_seconds: [32, 38]
  hard_max_seconds: 40
  target_words: [75, 90]
  # Calibrate with `creatoros calibrate <recording>`; 150 wpm is a starting assumption, not a measurement.
  words_per_minute: 150
  pause_allowance_seconds: 2.0

# Packages with "scoring": "v3" (from 20 Nov 2026): 90-105 words, 40-45 seconds, 45 s hard maximum.
# Older v1/v2 packages keep the limits above so historical packages still validate.
script_v5:
  target_seconds: [35, 45]
  hard_max_seconds: 45
  target_words: [85, 105]

# v6 (from 23 Nov 2026): same length targets, but duration is estimated at a natural moderate pace (140 wpm) with a
# pause after every sentence, so a 105-word script usually does NOT fit; about 85-95 words does.
script_v6:
  target_seconds: [35, 45]
  hard_max_seconds: 45
  target_words: [85, 105]
  words_per_minute: 140
  pause_seconds_per_sentence: 0.35

script_v3:
  target_seconds: [40, 45]
  hard_max_seconds: 45
  target_words: [90, 105]

transcription:
  backend: auto            # auto | sherpa | faster_whisper
  whisper_model: sherpa-onnx-whisper-small
  whisper_language: hi     # Hinglish is decoded as Hindi, then matched phonetically to the Roman script
  threads: 4
  vad:
    min_silence: 0.25
    min_speech: 0.12
    threshold: 0.5

editing:
  match_threshold: 0.55     # minimum script-sentence match to accept a take
  weak_match: 0.72          # below this, the caption is flagged for human review
  pad_before: 0.10
  pad_after: 0.16
  max_natural_pause: 0.45   # pauses longer than this are tightened
  punch_in_scale: 1.06      # alternate framing across jump cuts; 1.0 disables
  face_crop: true

audio:
  highpass_hz: 80
  denoise_db: 10
  presence_db: 2.0
  compressor_ratio: 2.5
  target_lufs: -14
  true_peak_db: -1.5
  music:
    enabled: false
    file: assets/music/influnexus_pad_01.wav
    gain_db: -27

export:
  width: 1080
  height: 1920
  fps: 30
  crf: 18
  preset: medium
  audio_bitrate: 192k
  min_seconds: 30
  max_seconds: 40

# Growth target (a goal, not a forecast). start_date is day 1. From 22 Nov 2026 the creator's plan is 150,000 Instagram
# followers in four months (replacing 100,000 in 60 days from 2026-11-20).
growth:
  target_followers: 150000
  days: 120
  start_date: "2026-11-22"
  platform: instagram        # the target counts Instagram followers only; other platforms are reported separately
